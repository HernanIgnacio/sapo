<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Planificador del Sapo</title><meta name="description" content="Planificador diario basado en Tráguese ese sapo"><meta name="theme-color" content="#EDEFE0"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/favicon.svg" type="image/svg+xml"><link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Sapo"><meta name="apple-mobile-web-app-status-bar-style" content="default"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: cabecera con pestañas arriba, contenido de una columna centrada; el cronograma ocupa todo el ancho y se desplaza horizontalmente. */
:root{
  --bg:#EDEFE0; --surface:#F8F9F0; --ink:#14291D; --muted:#4A5F52; --line:#CBD3BC;
  --accent:#2F7A32; --accent-ink:#ffffff; --accent-soft:#DDEBC4; --warn:#A85A0A; --danger:#A3392F;
  --sun:#F2A03D; --sun-ink:#1A1208; --pond:#0F2A1C; --pond-ink:#F4F6E8; --lime:#B7E04A; --frog:#7CC24E;
  --f-display:'Fraunces',Georgia,'Times New Roman',serif;
  --alert:#F2A03D; --alert-ink:#1A1208; --lw:200px;
  --f-body:'Figtree','Segoe UI',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);padding-inline:16px;padding-block:0 48px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin-inline:auto}
.wrap.wide{max-width:1200px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px 8px;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;max-width:1200px;margin-inline:auto}
.brand h1{font:800 22px/1 var(--f-display);margin:0;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:13px}
.brand .sp{flex:1}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;padding:6px;font-size:13px}
nav.tabs{display:flex;gap:6px;overflow-x:auto;max-width:1200px;margin-inline:auto}
nav.tabs button{flex:0 0 auto;min-height:44px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600}
nav.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
main{padding-top:20px;padding-bottom:96px}
h2{font:800 28px/1.1 var(--f-display);margin:0 0 4px;text-wrap:balance;letter-spacing:-.01em}
.hint{color:var(--muted);margin:0 0 16px;max-width:60ch}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{min-height:44px;padding:0 16px;border:0;background:none;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.pri-b{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.danger{color:var(--danger)}
.btn.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.sub{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.sub .lbl{font:700 20px/1.2 var(--f-display);flex:1;min-width:12ch}
.sub .lbl::first-letter{text-transform:uppercase}
.prog{height:8px;border-radius:99px;background:var(--accent-soft);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 14px}
ul.list{list-style:none;margin:0;padding:0}
.task{display:flex;align-items:flex-start;gap:8px;min-height:56px;padding-block:6px;border-bottom:1px solid var(--line)}
.task>.chk,.task>.pri,.task>.ico{margin-top:4px}
.tbody{flex:1;min-width:0;display:flex;flex-direction:column}
.meta{padding:0 4px 4px;display:flex;gap:6px;flex-wrap:wrap}
.macts{flex:1 0 100%;display:flex;gap:6px;flex-wrap:wrap;padding:0 0 6px}
.mopt{flex:1 0 100%;text-align:right;margin-top:-6px}
.task.m{flex-wrap:wrap}
textarea.auto{field-sizing:content}
.dsel{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.add .dsel{flex:0 0 auto}
details.fut{margin-top:18px}
details.fut summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600;color:var(--muted)}
.sug.fu{align-items:center;padding-block:8px}
.fx{flex:1;min-width:0;display:flex;flex-direction:column}
.fx .lm{margin:2px 0 0}
.arow{display:flex;gap:10px;align-items:flex-start;padding-block:10px;border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:0}
.arow .ok{flex:0 0 auto;width:24px;height:24px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:14px;font-weight:700;margin-top:1px}
.arow .ltxt{color:var(--muted)}
textarea.txt,textarea.goal-title{resize:none;overflow:hidden;display:block;width:100%;font-family:inherit}
textarea.txt{border:0;background:none;padding:6px 4px;font-size:17px;line-height:1.35;min-height:44px}
.task:last-child{border-bottom:0}
.chk{flex:0 0 auto;width:36px;height:36px;border-radius:10px;border:2px solid var(--muted);background:none;display:grid;place-items:center;padding:0}
.chk svg{width:20px;height:20px;opacity:0}
.done .chk{background:var(--accent);border-color:var(--accent)}
.done .chk svg{opacity:1;stroke:var(--accent-ink)}
.txt{flex:1;min-width:0;min-height:44px;border:0;background:none;padding:0 4px;font-size:17px}
.done .txt{text-decoration:line-through;color:var(--muted)}
.chip{flex:0 1 auto;font-size:12.5px;line-height:1.3;padding:3px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.ico{flex:0 0 auto;min-width:40px;height:40px;border:0;background:none;border-radius:10px;color:var(--muted);font-size:15px;padding:0 6px}
.ico:hover{background:var(--accent-soft);color:var(--accent)}
.row-actions{display:flex;flex:0 0 auto}
.add{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.add input[type=text],.add select{min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 12px}
.add input[type=text]{flex:1 1 220px;min-width:0}
.add select{flex:0 1 200px;min-width:0}
.block{margin-top:22px}
.block h3{font:700 13px/1 var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}
.empty{padding:22px 8px;color:var(--muted);text-align:center}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:14px}
.banner span{flex:1 1 220px}
.sug{display:flex;align-items:center;gap:10px;min-height:48px;border-bottom:1px solid var(--line)}
.sug:last-child{border-bottom:0}
.sug b{flex:1;min-width:0;font-weight:500}
.goal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px}
.goal-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.goal-title{font:800 20px/1.25 var(--f-display);border:0;border-bottom:1px dashed var(--line);background:none;min-height:44px;padding:6px 0}
.gmeta{display:flex;align-items:center;gap:10px;margin-top:8px;justify-content:space-between}
.sacts{flex:1 0 100%;display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-left:44px}
.dates{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.dates label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:2px}
input[type=date]{min-height:40px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 8px;font-family:var(--f-mono);font-size:14px}
.step{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-block:6px}
.step .txt{flex:1 1 180px}
.step input[type=date]{flex:0 0 auto}
.zoom{margin-left:auto}
.gscroll{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.gin{position:relative}
.grow{display:flex;height:44px;border-bottom:1px solid var(--line)}
.grow.ghead{height:34px;background:var(--bg);position:sticky;top:0}
.glab{position:sticky;left:0;z-index:3;flex:0 0 var(--lw);width:var(--lw);background:var(--surface);padding:0 10px;display:flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border-right:1px solid var(--line);font-size:14px}
.ghead .glab{background:var(--bg)}
.glab.g{font-weight:700;font-family:var(--f-display)}
.glab.s{padding-left:22px;color:var(--muted)}
.glab.s.done{text-decoration:line-through}
.gtrack{position:relative;flex:0 0 auto}
.gm{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);padding:8px 6px;font-size:12px;color:var(--muted);text-transform:capitalize;white-space:nowrap}
.gb{position:absolute;top:11px;height:22px;border-radius:7px;background:var(--accent-soft);border:1px solid var(--accent);overflow:hidden}
.gb i{display:block;height:100%;background:var(--accent);opacity:.55}
.gb.step{top:14px;height:16px;border-radius:5px;background:var(--accent);opacity:.8;border:0}
.gb.step.done{background:var(--muted);opacity:.5}
.gdue{position:absolute;top:10px;width:12px;height:12px;transform:rotate(45deg);background:var(--ink);top:16px;margin-left:-6px;border-radius:2px}
.gv{position:absolute;top:34px;bottom:0;width:0;border-left:1px solid var(--line);z-index:1;pointer-events:none}
.gtoday{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--danger);z-index:2;pointer-events:none}
.gtoday::after{content:"hoy";position:absolute;top:34px;left:4px;font-size:11px;color:var(--danger);font-weight:700}
.panel{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px}
.panel>div{background:var(--surface);border-radius:16px;padding:18px;width:min(560px,100%);max-height:90%;overflow:auto}
.panel textarea{width:100%;height:180px;font:13px/1.4 var(--f-mono);border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--bg)}
.chk.rep{border-color:var(--accent);color:var(--accent);font-size:18px;font-weight:700;border-style:dashed}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.reprow{flex:1 0 100%;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-left:44px}
.day{min-width:44px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font:600 14px var(--f-body);padding:0 6px}
.day[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rc{font-size:12.5px;color:var(--muted);margin-left:6px}
.gb.step.rep{background:repeating-linear-gradient(90deg,var(--accent) 0 6px,transparent 6px 10px);opacity:.6}
.pri{flex:0 0 auto;min-width:40px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:none;font:700 14px var(--f-mono);padding:0 6px;color:var(--muted)}
.pri.pA{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pri.pB{border-color:var(--accent);color:var(--accent)}
.pri.pC{color:var(--ink)}
.pri.pD,.pri.pE{border-style:dashed}
.pri.pE{color:var(--danger);border-color:var(--danger)}
.done .pri{opacity:.5}
li.detail{list-style:none;padding:4px 0 14px 46px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
li.detail label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
li.detail input{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 12px;font-size:16px}
.imp{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.dh{margin:0;font-size:13px;color:var(--muted)}
.legend{font-size:13px;color:var(--muted);margin:10px 2px 0;max-width:70ch}
.psub{margin:4px 0 10px;font-size:13.5px;color:var(--muted);max-width:70ch}
.psub b{color:var(--ink)}
.prow .pl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bdg{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:99px;background:var(--alert);color:var(--alert-ink);font-size:12px;line-height:20px;font-weight:700}
nav.tabs button[aria-selected="true"] .bdg{background:var(--accent-ink);color:var(--accent)}
.lates{position:fixed;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:40;max-width:728px;margin-inline:auto;display:flex;align-items:center;gap:8px;background:var(--alert);color:var(--alert-ink);border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.lates .go{flex:1;min-height:56px;padding:10px 14px;border:0;background:none;color:inherit;text-align:left;font-weight:600;line-height:1.3}
.lates .go small{display:block;font-weight:400;opacity:.9}
.lates .x{flex:0 0 auto;width:44px;height:44px;border:0;background:none;color:inherit;font-size:18px}
.lcard{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--alert);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.lt{display:flex;gap:10px;align-items:flex-start}
.lt .pri{margin-top:2px;cursor:default}
.ltxt{font-size:17px;line-height:1.35;min-width:0;overflow-wrap:anywhere}
.lm{margin:6px 0 10px;font-size:13px;color:var(--muted)}
.lacts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dpick{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.dacts{display:flex;gap:6px;flex-wrap:wrap}
.grow.ghead.tall{height:54px}
.grow.tall2{height:50px}
.gday{position:absolute;top:0;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--muted);border-left:1px solid var(--line)}
.gday b{font-size:15px;color:var(--ink);font-weight:500}
.gday.now b{background:var(--accent);color:var(--accent-ink);border-radius:99px;min-width:26px;text-align:center;line-height:26px}
.gcol{position:absolute;top:54px;bottom:0;border-left:1px solid var(--line)}
.gcol.we{background:var(--accent-soft);opacity:.45}
.gcol.now{background:var(--accent-soft);opacity:.9}
.gdot{position:absolute;top:35px;width:10px;height:10px;border-radius:50%;border:2px solid var(--accent);background:var(--surface)}
.gdot.on{background:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.tile .k{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.tile .big{font:800 44px/1.1 var(--f-display);color:var(--accent);margin-block:4px}
.tile .big small{font-size:22px;color:var(--muted);font-weight:600}
.tile .s{font-size:13px;color:var(--muted)}
.tile.warn .big{color:var(--warn)}
.chart{display:flex;align-items:flex-end;gap:4px;height:140px;padding-block:10px}
.chart .col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;height:100%}
.chart .col i{display:block;width:100%;max-width:26px;background:var(--accent);opacity:.55;border-radius:4px 4px 0 0}
.chart .col.now i{opacity:1}
.chart .n,.chart .d{font-size:11px;color:var(--muted);line-height:1.2}
.chart .col.now .d{color:var(--ink);font-weight:500}
.prow{display:flex;align-items:center;gap:12px;min-height:44px}
.prow .pl{flex:0 0 110px;font-weight:600}
.prow .prog{flex:1}
.prow .pv{flex:0 0 52px;text-align:right;color:var(--muted);font-size:14px}
.grow2{padding-block:12px;border-bottom:1px solid var(--line)}
.grow2:last-child{border-bottom:0}
.grow2 .gt{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.grow2 .gt b{flex:1 1 200px;min-width:0;font-family:var(--f-display);font-size:17px}
.grow2 .gs{font-size:12.5px;color:var(--muted);margin-top:6px}
.pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.pill.ok{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.bad{color:var(--warn);border-color:var(--warn)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:99px;font-weight:600;max-width:calc(100% - 32px);text-align:center}
@media (max-width:520px){:root{--lw:120px}}
@media (prefers-reduced-motion:no-preference){.prog i{transition:width .25s}}
/* ---------- El Charco: identidad del sapo ---------- */
.brand{align-items:center}
.brand svg{flex:0 0 auto;width:44px;height:34px}
.brand h1{font-size:23px;line-height:1.05}
h2{font-weight:800;letter-spacing:-.015em}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.card,.goal,.tile,.lcard,.gscroll{border-radius:20px}
.btn,.add input[type=text],.add select{border-radius:99px}
.btn{padding:0 20px}
.btn.sm{padding:0 16px}
.seg{border-radius:99px}
.chk{border-radius:50%}
.done .chk svg{stroke:var(--accent-ink)}
.chip{border-radius:99px}
.pri{border-radius:99px;font-family:var(--f-display);font-weight:800}
.pri.pA{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
.pri.pB{border-color:var(--accent);color:var(--accent);border-width:2px}
.done .pri.pA{opacity:.55}
nav.tabs button{font-weight:600}
nav.tabs button[aria-selected="true"]{background:var(--lime);border-color:var(--lime);color:var(--pond)}
nav.tabs button[aria-selected="true"] .bdg{background:var(--pond);color:var(--lime)}
.btn.pri-b{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lates{border-radius:99px}
.lcard{border-left-width:6px}
.tile .big{font-family:var(--f-display)}
.tile.frog{background:var(--pond);border-color:var(--pond);color:var(--pond-ink)}
.tile.frog .k,.tile.frog .s{color:var(--pond-ink);opacity:.85}
.tile.frog .big{color:var(--lime)}
.pill.bad{color:var(--warn)}
.gb.step.done{background:var(--muted)}
.pads{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.pads i{display:block;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--bg)}
.pads i.d{background:var(--accent);border-color:var(--accent)}
.pads i.c{border-color:var(--sun);background:var(--sun)}
.pads svg{width:30px;height:24px}
/* tarjeta del sapo */
.hero{position:relative;overflow:hidden;background:var(--pond);color:var(--pond-ink);border-radius:26px;padding:22px 22px 22px;margin-bottom:22px}

<script>
(function(){
const KEY='planificador-sapo-v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const p=s.split('-').map(Number);return new Date(p[0],(p[1]||1)-1,p[2]||1)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const monday=d=>{const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const today=()=>new Date(new Date().getFullYear(),new Date().getMonth(),new Date().getDate());
const fmt=(d,o)=>d.toLocaleDateString('es-AR',o);


function keyFor(sc,d){
  if(sc==='day')return iso(d);
  if(sc==='week')return iso(monday(d));
  if(sc==='month')return d.getFullYear()+'-'+pad(d.getMonth()+1);
  return String(d.getFullYear());
}
function keyStart(sc,k){
  if(sc==='month')return parse(k+'-01');
  if(sc==='year')return new Date(+k,0,1);
  return parse(k);
}
function shiftDate(sc,d,n){
  const x=new Date(d);
  if(sc==='day')x.setDate(x.getDate()+n);
  else if(sc==='week')x.setDate(x.getDate()+7*n);
  else if(sc==='month'){x.setDate(1);x.setMonth(x.getMonth()+n)}
  else{x.setDate(1);x.setFullYear(x.getFullYear()+n)}
  return x;
}
function label(sc,k){
  const s=keyStart(sc,k);
  if(sc==='day')return fmt(s,{weekday:'long',day:'numeric',month:'long'});
  if(sc==='week'){const e=addDays(s,6);return 'Semana del '+fmt(s,{day:'numeric',month:'short'})+' al '+fmt(e,{day:'numeric',month:'short'})}
  if(sc==='month')return fmt(s,{month:'long',year:'numeric'});
  return k;
}

/* ---------- datos ---------- */
let S=load();
function seed(){
  const t=today();
  const g={id:uid(),title:'Terminar el curso de inglés B2',start:iso(t),due:iso(addDays(t,98)),ex:1,steps:[
    {id:uid(),text:'Elegir el curso y pagar la matrícula',due:iso(addDays(t,7)),done:true},
    {id:uid(),text:'Estudiar 30 minutos',rep:[1,3,5]},
    {id:uid(),text:'Completar los módulos 1 a 4',due:iso(addDays(t,42))},
    {id:uid(),text:'Completar los módulos 5 a 8',due:iso(addDays(t,77))},
    {id:uid(),text:'Rendir el examen final',due:iso(addDays(t,98))}]};
  return{v:1,
    master:[
      {id:uid(),text:'Aprender a cocinar 10 recetas nuevas',ex:1},
      {id:uid(),text:'Ordenar los papeles del año',ex:1},
      {id:uid(),text:'Hacer un viaje corto en familia',ex:1}],
    goals:[g],
    tasks:[
      {id:uid(),text:'Mirar el módulo 1 (45 min)',scope:'day',key:keyFor('day',t),goalId:g.id,pri:'A',why:'Sin esto el curso se atrasa y pierdo la fecha del examen',ex:1},
      {id:uid(),text:'Llamar al contador',scope:'day',key:keyFor('day',t),pri:'B',ex:1},
      {id:uid(),text:'Caminar 30 minutos',scope:'day',key:keyFor('day',t),pri:'C',ex:1},
      {id:uid(),text:'Terminar el módulo 1 y 2',scope:'day',key:keyFor('day',addDays(t,2)),goalId:g.id,ex:1},
      {id:uid(),text:'Pagar el seguro del auto',scope:'day',key:iso(addDays(t,-1)),pri:'B',ex:1},
      {id:uid(),text:'Revisar gastos del mes',scope:'day',key:keyFor('day',addDays(t,5)),ex:1}]
      .concat([[1,'Leer 20 páginas','A',3,1],[2,'Armar el plan de estudio','A',3,1],[2,'Pagar la luz','B',2],[3,'Caminar 30 minutos','B',2],[4,'Leer 20 páginas','A',3,1],[4,'Mirar redes un rato','C',1],[5,'Ordenar el escritorio','C',1]].map(a=>{
        const d=iso(addDays(t,-a[0]));
        return{id:uid(),text:a[1],scope:'day',key:d,done:true,doneAt:a[1]==='Pagar la luz'?iso(addDays(t,-1)):d,pri:a[2],impact:a[3],goalId:a[4]?g.id:undefined,ex:1}})),
    ui:{tab:'plan',scope:'day',anchor:iso(t),zoom:'trim'}};
}
function load(){
  try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);if(d&&d.v===1)return prep(d)}}catch(e){}
  return prep(seed());
}
/* Quita las tareas repetidas de hoy en adelante que quedaron sueltas cuando un paso dejó de repetirse */
function cleanup(d){
  const ti=iso(today()),rep={},gone=[];
  (d.goals||[]).forEach(g=>g.steps.forEach(s=>{rep[s.id]=s}));
  d.tasks=(d.tasks||[]).filter(t=>{
    const s=rep[t.stepId];
    if(t.rec&&!t.done&&t.key>=ti&&!(s&&s.rep)){if(s&&s.gen)delete s.gen[t.key];return false}
    return true;
  });
  return d;
}
function prep(d){
  migrate(d);cleanup(d);
  d.areas=d.areas||[];d.areaHist=d.areaHist||[];d.letgo=d.letgo||[];d.journal=d.journal||{};
  d.tres=d.tres||['','',''];
  d.vida=d.vida||[{k:'carrera',name:'Carrera y finanzas',score:0,metas:''},{k:'relaciones',name:'Relaciones y familia',score:0,metas:''},{k:'salud',name:'Salud y estado físico',score:0,metas:''}];
  d.ui=d.ui||{tab:'plan'};
  return d;
}
/* el Plan es solo diario: las tareas de semana, mes o año pasan a hoy (o a su día, si ya estaban hechas) */
function migrate(d){
  if(d.m2)return d;
  const ti=iso(today());
  (d.tasks||[]).forEach(t=>{
    if(t.scope==='day')return;
    if(t.done){t.scope='day';t.key=t.doneAt||ti}
    else{if(!t.due0)t.due0=dueOf(t);t.scope='day';t.key=ti}
  });
  d.m2=1;return d;
}

const PRI=['A','B','C','D','E'];
const PRINAME={A:'Importante',B:'Debería',C:'Agradable',D:'Delegar',E:'Eliminar'};
const IMPNAME={1:'Poco',2:'Medio',3:'Mucho'};
const rank=t=>t.pri?PRI.indexOf(t.pri):5;
function sorted(list){return list.map((t,i)=>[t,i]).sort((a,b)=>rank(a[0])-rank(b[0])||a[1]-b[1]).map(x=>x[0])}
/* Postergadas: tareas no rutinarias, sin completar, cuya fecha ya pasó */
function late(){
  const ti=iso(today());
  return S.tasks.filter(t=>!t.done&&!t.rec&&dueOf(t)<ti).sort((a,b)=>{const x=dueOf(a),y=dueOf(b);return x<y?-1:x>y?1:rank(a)-rank(b)});
}
function reschedule(t,k){
  if(!t.due0)t.due0=dueOf(t);
  t.moves=(t.moves||0)+1;t.scope='day';t.key=k;
}
/* Cada paso con fecha genera su tarea en el Plan de ese día */
function syncSteps(){
  let ch=false;
  S.goals.forEach(g=>g.steps.forEach(s=>{
    if(s.rep||!s.due||s.done)return;
    if(S.tasks.some(t=>t.stepId===s.id&&!t.rec))return;
    S.tasks.push({id:uid(),text:s.text,scope:'day',key:s.due,goalId:g.id,stepId:s.id,auto:1});
    ch=true;
  }));
  return ch;
}

/* Pasos que se repiten: aparecen como tareas del día en los días marcados, dentro del rango del objetivo */
const DAYS=[[1,'Lu'],[2,'Ma'],[3,'Mi'],[4,'Ju'],[5,'Vi'],[6,'Sa'],[0,'Do']];
function occ(g,s){
  if(!g.start||!g.due||!s.rep)return 0;
  let n=0;
  for(let d=parse(g.start);iso(d)<=g.due;d=addDays(d,1))if(s.rep.includes(d.getDay()))n++;
  return n;
}
function repDone(s){return S.tasks.filter(t=>t.stepId===s.id&&t.done).length}
function stepFrac(g,s){
  if(!s.rep)return s.done?1:0;
  const tot=occ(g,s);
  return tot?Math.min(1,repDone(s)/tot):0;
}
function ensureRec(from,to){
  let changed=false;
  S.goals.forEach(g=>g.steps.forEach(s=>{
    if(!s.rep||!s.rep.length)return;
    s.gen=s.gen||{};
    for(let d=new Date(from);d<=to;d=addDays(d,1)){
      const k=iso(d);
      if(s.gen[k]||(g.start&&k<g.start)||(g.due&&k>g.due)||!s.rep.includes(d.getDay()))continue;
      s.gen[k]=1;
      S.tasks.push({id:uid(),text:s.text,scope:'day',key:k,goalId:g.id,stepId:s.id,rec:1});
      changed=true;
    }
  }));
  return changed;
}
function pct(g){const n=g.steps.length;return n?Math.round(g.steps.reduce((a,s)=>a+stepFrac(g,s),0)/n*100):0}

      (rep?'<div class="reprow">'+DAYS.map(d=>'<button class="day" data-act="repday" '+ids+' data-v="'+d[0]+'" aria-pressed="'+s.rep.includes(d[0])+'">'+d[1]+'</button>').join('')+
        '<span class="rc mono">'+(occ(g,s)?repDone(s)+' de '+occ(g,s)+' veces':(g.due?'elegí los días':'poné la fecha de meta'))+'</span></div>':'')+
      '</div>';
    });
    h+='<form class="add" data-add="step" data-id="'+g.id+'"><input type="text" placeholder="Nuevo paso" aria-label="Nuevo paso" autocomplete="off"><button class="btn" type="submit">Agregar paso</button></form>';
    h+='<div style="margin-top:12px;text-align:right"><button class="btn sm danger'+(armed===g.id?' armed':'')+'" data-act="gdel" data-id="'+g.id+'">'+(armed===g.id?'Tocá de nuevo para borrar':'Borrar objetivo')+'</button></div></section>';
  });
  return h;
}

function viewGantt(){
  const gs=S.goals.filter(g=>g.start&&g.due);
  let h='<div class="bar"><div><h2>Cronograma</h2><p class="hint" style="margin:0">Cada objetivo con sus pasos en secuencia. Los pasos sin fecha no se dibujan.</p></div><div class="seg zoom" role="group" aria-label="Escala">'+[['mes','Mes'],['trim','Trimestre'],['anio','Año']].map(z=>'<button data-act="zoom" data-v="'+z[0]+'" aria-pressed="'+(S.ui.zoom===z[0])+'">'+z[1]+'</button>').join('')+'</div></div>';
  if(!gs.length)return h+'<div class="empty card">Para ver el cronograma, ponele fecha de inicio y de meta a un objetivo.</div>';
  return h+(S.ui.zoom==='mes'?ganttMonth(gs):ganttRange(gs));

function ganttRange(gs){
  let min=today(),max=today();
  gs.forEach(g=>{[g.start,g.due].concat(g.steps.map(s=>s.due).filter(Boolean)).forEach(x=>{const d=parse(x);if(d<min)min=d;if(d>max)max=d})});
  min=new Date(min.getFullYear(),min.getMonth(),1);
  max=new Date(max.getFullYear(),max.getMonth()+1,0);
  const ppd={trim:6,anio:2.2}[S.ui.zoom]||6;
  const DAY=864e5;
  const days=Math.round((max-min)/DAY)+1;
  const off=s=>Math.round((parse(s)-min)/DAY)*ppd;
  const W=Math.round(days*ppd);
  let months='',lines='';
  for(let m=new Date(min);m<=max;m=new Date(m.getFullYear(),m.getMonth()+1,1)){
    const left=Math.round(((m-min)/DAY)*ppd);
    const dim=new Date(m.getFullYear(),m.getMonth()+1,0).getDate();
    months+='<div class="gm" style="left:'+left+'px;width:'+Math.round(dim*ppd)+'px">'+esc(fmt(m,{month:'short',year:'2-digit'}))+'</div>';
    lines+='<div class="gv" style="left:calc(var(--lw) + '+left+'px)"></div>';
  }
  let h='<div class="gscroll"><div class="gin" style="width:calc(var(--lw) + '+W+'px)"><div class="grow ghead"><div class="glab">Objetivo</div><div class="gtrack" style="width:'+W+'px">'+months+'</div></div>'+lines;
  gs.forEach(g=>{
    const l=off(g.start),w=Math.max(off(g.due)-l,12);
    h+='<div class="grow"><div class="glab g" title="'+esc(g.title)+'">'+esc(g.title)+'</div><div class="gtrack" style="width:'+W+'px"><div class="gb" style="left:'+l+'px;width:'+w+'px"><i style="width:'+pct(g)+'%"></i></div></div></div>';
    let prev=g.start;
    g.steps.forEach(s=>{
      let bars='';
      if(s.rep){
        const left=off(g.start);
        bars='<div class="gb step rep" style="left:'+left+'px;width:'+Math.max(off(g.due)-left,6)+'px" title="Se repite: '+DAYS.filter(d=>s.rep.includes(d[0])).map(d=>d[1]).join(' ')+'"></div>';
      }else if(s.due){
        const a=parse(prev)<parse(s.due)?prev:s.due;
        const left=off(a),width=Math.max(off(s.due)-left,6);
        bars='<div class="gb step'+(s.done?' done':'')+'" style="left:'+left+'px;width:'+width+'px" title="'+esc(s.text)+'"></div><div class="gdue" style="left:'+off(s.due)+'px"></div>';
        prev=s.due;
      }
      h+='<div class="grow"><div class="glab s'+(s.done?' done':'')+'" title="'+esc(s.text)+'">'+esc(s.text)+'</div><div class="gtrack" style="width:'+W+'px">'+bars+'</div></div>';
    });
  });
  h+='<div class="gtoday" style="left:calc(var(--lw) + '+off(iso(today()))+'px)"></div></div></div>';
  return h;
}

/* Vista mensual tipo calendario: una columna por día, con la fecha arriba */
function ganttMonth(gs){
  const ti=iso(today());
  const gm=S.ui.gm||keyFor('month',today());
  const first=keyStart('month',gm);
  const dim=new Date(first.getFullYear(),first.getMonth()+1,0).getDate();
  const mStart=iso(first),mEnd=iso(new Date(first.getFullYear(),first.getMonth(),dim));
  const ppd=40,W=dim*ppd;
  const idx=s=>Math.round((parse(s)-first)/864e5);
  const span=(a,b)=>{const A=Math.max(idx(a),0),B=Math.min(idx(b),dim-1);return B<A?null:{l:A*ppd,w:(B-A+1)*ppd}};
  let h='<div class="sub"><button class="btn" data-act="gmn" data-v="-1" aria-label="Mes anterior">‹</button><div class="lbl">'+esc(label('month',gm))+'</div><button class="btn" data-act="gmn" data-v="1" aria-label="Mes siguiente">›</button>'+(gm===keyFor('month',today())?'':'<button class="btn" data-act="gnow">Hoy</button>')+'</div>';
  const vis=gs.filter(g=>g.start<=mEnd&&g.due>=mStart);
  if(!vis.length)return h+'<div class="empty card">Ningún objetivo cae en este mes.</div>';
  let head='',cols='';
  for(let i=0;i<dim;i++){
    const d=addDays(first,i),k=iso(d),wd=d.getDay(),cls=(wd===0||wd===6?' we':'')+(k===ti?' now':'');
    head+='<div class="gday'+cls+'" style="left:'+i*ppd+'px;width:'+ppd+'px"><span>'+'DLMMJVS'[wd]+'</span><b class="mono">'+(i+1)+'</b></div>';
    cols+='<div class="gcol'+cls+'" style="left:calc(var(--lw) + '+i*ppd+'px);width:'+ppd+'px"></div>';
  }
  h+='<div class="gscroll"><div class="gin" style="width:calc(var(--lw) + '+W+'px)">'+cols+
    '<div class="grow ghead tall"><div class="glab">Objetivo</div><div class="gtrack" style="width:'+W+'px">'+head+'</div></div>';
  vis.forEach(g=>{
    const sp=span(g.start,g.due);
    let dots='';
    const byDay={};
    S.tasks.forEach(t=>{if(t.goalId===g.id&&t.scope==='day'&&t.key>=mStart&&t.key<=mEnd){(byDay[t.key]=byDay[t.key]||[]).push(t)}});
    Object.keys(byDay).forEach(k=>{const all=byDay[k].every(t=>t.done);dots+='<span class="gdot'+(all?' on':'')+'" style="left:'+(idx(k)*ppd+ppd/2-5)+'px" title="'+byDay[k].length+' tarea(s)"></span>'});
    h+='<div class="grow tall2"><div class="glab g" title="'+esc(g.title)+'">'+esc(g.title)+'</div><div class="gtrack" style="width:'+W+'px">'+(sp?'<div class="gb" style="left:'+sp.l+'px;width:'+sp.w+'px"><i style="width:'+pct(g)+'%"></i></div>':'')+dots+'</div></div>';
    let prev=g.start;
    g.steps.forEach(s=>{
      let bars='';
      if(s.rep){
        const r=span(g.start,g.due);
        if(r){
          for(let i=0;i<dim;i++){if(s.rep.includes(addDays(first,i).getDay())){const k=iso(addDays(first,i));if(k>=g.start&&k<=g.due)bars+='<span class="gdot rp'+(S.tasks.some(t=>t.stepId===s.id&&t.key===k&&t.done)?' on':'')+'" style="left:'+(i*ppd+ppd/2-5)+'px;top:17px"></span>'}}
        }
      }else if(s.due){
        const a=parse(prev)<parse(s.due)?prev:s.due;
        const r=span(a,s.due);
        if(r)bars+='<div class="gb step'+(s.done?' done':'')+'" style="left:'+r.l+'px;width:'+r.w+'px" title="'+esc(s.text)+'"></div>';
        if(s.due>=mStart&&s.due<=mEnd)bars+='<div class="gdue" style="left:'+(idx(s.due)*ppd+ppd/2)+'px"></div>';
        prev=s.due;
      }
      h+='<div class="grow"><div class="glab s'+(s.done?' done':'')+'" title="'+esc(s.text)+'">'+esc(s.text)+'</div><div class="gtrack" style="width:'+W+'px">'+bars+'</div></div>';
    });
  });
  h+='</div></div><p class="legend">Los círculos son tareas del día ligadas al objetivo: llenos si ya están hechas. En los pasos que se repiten, un círculo marca cada día que toca.</p>';
  return h;
}

/* ---------- estadísticas ---------- */
function stamp(x){if(x.done)x.doneAt=iso(today());else delete x.doneAt}
function dueOf(t){
  const s=keyStart(t.scope,t.key);
  if(t.scope==='day')return t.key;
  if(t.scope==='week')return iso(addDays(s,6));
  if(t.scope==='month')return iso(new Date(s.getFullYear(),s.getMonth()+1,0));
  return t.key+'-12-31';
}
function activity(){
  const m={};
  S.tasks.forEach(t=>{if(t.done&&t.doneAt)m[t.doneAt]=(m[t.doneAt]||0)+1});
  S.goals.forEach(g=>g.steps.forEach(s=>{if(s.done&&s.doneAt&&!S.tasks.some(t=>t.stepId===s.id))m[s.doneAt]=(m[s.doneAt]||0)+1}));
  return m;
}
function streakOf(m){
  let d=today(),n=0;
  if(!m[iso(d)])d=addDays(d,-1);
  while(m[iso(d)]){n++;d=addDays(d,-1)}
  return n;
}
let toastT;
function cheer(){
  const m=activity(),n=m[iso(today())]||0,st=streakOf(m);
  const el=document.getElementById('toast');if(!el)return;
  beep('ok');
  el.textContent='Hecho. Hoy completaste '+n+(n===1?' tarea':' tareas')+(st>1?' · racha de '+st+' días':'');
  el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true},2800);
}
function goalState(g){
  const p=pct(g),t=today(),a=g.start&&parse(g.start),b=g.due&&parse(g.due);
  if(p>=100&&g.steps.length)return{txt:'Completado',cls:'ok',p:p};
  if(!a||!b||b<=a)return{txt:'Sin fechas',cls:'',p:p};
  const el=Math.max(0,Math.min(1,(t-a)/(b-a)))*100;
  const left=Math.round((b-t)/864e5);
  if(left<0)return{txt:'Vencido hace '+(-left)+' d',cls:'bad',p:p,el:el};
  return{txt:p+5>=el?'Al ritmo':'Atrasado',cls:p+5>=el?'ok':'bad',p:p,el:el,left:left};
}
function ratio(a,b){return b?Math.round(a/b*100):null}
function bar(label,p,val,sub){
  return '<div class="prow"><span class="pl" title="'+esc(label)+'">'+esc(label)+'</span><div class="prog"><i style="width:'+p+'%"></i></div><span class="mono pv">'+val+'</span></div>'+(sub?'<p class="psub">'+sub+'</p>':'');
}
function paretoHtml(){
  const done=S.tasks.filter(x=>x.done);
  let h='<div class="block"><h3>Dónde va tu esfuerzo</h3><div class="card">';
  if(!done.length)h+='<div class="empty">Cuando completes tareas con su letra A a E, acá ves qué parte de tu esfuerzo fue a lo importante.</div>';
  else{
    const cnt={};done.forEach(x=>{const k=x.pri||'-';cnt[k]=(cnt[k]||0)+1});
    PRI.concat('-').forEach(k=>{const c=cnt[k]||0;h+='<div class="pr'+k+'">'+bar(k==='-'?'Sin letra':k+' · '+PRINAME[k],Math.round(c/done.length*100),c)+'</div>'});
    const a=cnt.A||0;
    h+='<p class="psub">'+(a?Math.round(a/done.length*100)+'% de lo que completaste fue A. ':'Todavía no completaste ninguna tarea A. ')+'La idea es que sean las primeras de cada día.</p>';
  }
  h+='</div></div>';
  // pareto del impacto
  const rated=done.filter(x=>x.impact);
  h+='<div class="block"><h3>El 20% que más rinde</h3><div class="card">';
  if(rated.length<5){
    h+='<div class="empty">Al terminar una tarea, tocá ○ y calificá cuánto aportó. Con 5 tareas calificadas empieza el análisis ('+rated.length+' de 5).</div>';
  }else{
    const ord=rated.slice().sort((a,b)=>b.impact-a.impact);
    const total=ord.reduce((s,x)=>s+x.impact,0);
    const k=Math.max(1,Math.ceil(ord.length*.2));
    const top=ord.slice(0,k).reduce((s,x)=>s+x.impact,0);
    h+='<p class="psub" style="margin-top:10px">Las <b>'+k+'</b> tareas de mayor impacto (el 20% de las '+ord.length+' que calificaste) concentran el <b>'+Math.round(top/total*100)+'%</b> del impacto total. Con una escala de 1 a 3 es una aproximación.</p>';
    const by={};
    rated.forEach(x=>{const g=x.goalId&&goalOf(x.goalId);const n=g?g.title:'Sin objetivo';(by[n]=by[n]||{s:0,c:0});by[n].s+=x.impact;by[n].c++});
    Object.keys(by).sort((a,b)=>by[b].s-by[a].s).forEach(n=>{h+=bar(n,Math.round(by[n].s/total*100),Math.round(by[n].s/total*100)+'%')});
    // ¿acierta mi criterio de importancia?
    const avg=l=>l.length?l.reduce((s,x)=>s+x.impact,0)/l.length:null;
    const ra=rated.filter(x=>x.pri==='A'),ro=rated.filter(x=>x.pri&&x.pri!=='A');
    const aa=avg(ra),ao=avg(ro);
    if(aa!=null&&ao!=null)h+='<p class="psub"><b>¿Tu criterio acierta?</b> Impacto promedio de tus A: <span class="mono">'+aa.toFixed(1)+'</span>. De las demás: <span class="mono">'+ao.toFixed(1)+'</span>. '+(aa>ao?'Tus A rinden más, así que estás eligiendo bien qué es importante.':'Tus A no rinden más que el resto. Conviene revisar qué consecuencias esperás de cada una.')+'</p>';
  }
  h+='</div></div>';
  return h;
}
function viewDash(){
  const t=today(),ti=iso(t),m=activity(),st=streakOf(m);
  const day=S.tasks.filter(x=>x.scope==='day'&&x.key===ti);
  const dayDone=day.filter(x=>x.done).length;
  const withDate=S.tasks.filter(x=>x.done&&x.doneAt);
  const onTime=withDate.filter(x=>x.doneAt<=(x.due0||dueOf(x))).length;
  const overdue=late().length;
  const recPast=S.tasks.filter(x=>x.rec&&x.key<ti),recDone=recPast.filter(x=>x.done).length;
  const moves=S.tasks.reduce((a,x)=>a+(x.moves||0),0);
  const ot=ratio(onTime,withDate.length);
  const main=S.goals.find(g=>g.main);
  const mainToday=main&&S.tasks.some(x=>x.done&&x.doneAt===ti&&x.goalId===main.id);
  let msg;
  if(!day.length)msg='Todavía no armaste la lista de hoy.';
  else if(dayDone===day.length)msg='Completaste toda la lista de hoy. Anotá esta sensación: es lo que se busca repetir.';
  else if(dayDone>0)msg='Ya llevás '+dayDone+' de '+day.length+' hoy. Seguí con la que más te pese.';
  else msg='Todavía no tildaste nada hoy. Empezá por la tarea más difícil.';
  let h='<h2>Tus sapos tragados</h2><p class="hint">'+msg+'</p>';
  const sapos=S.tasks.filter(x=>x.done&&x.pri==='A'&&x.doneAt&&x.doneAt>=iso(addDays(t,-6))).length;
  h+='<div class="tiles">'+
   '<div class="tile frog"><div class="k">Sapos tragados</div><div class="big mono">'+sapos+'</div><div class="s">tareas A hechas en 7 días</div></div>'+
   '<div class="tile"><div class="k">Racha</div><div class="big mono">'+st+'</div><div class="s">'+(st===1?'día seguido':'días seguidos')+' con al menos una tarea hecha</div></div>'+
   '<div class="tile"><div class="k">Hoy</div><div class="big mono">'+dayDone+'<small>/'+day.length+'</small></div><div class="s">tareas de la lista del día</div></div>'+
   '<div class="tile"><div class="k">Hechas en fecha</div><div class="big mono">'+(ot==null?'–':ot+'%')+'</div><div class="s">'+(withDate.length?onTime+' de '+withDate.length+' completadas a tiempo':'aparece al completar tareas')+'</div></div>'+
   '<div class="tile'+(overdue?' warn':'')+'"><div class="k">Postergadas</div><div class="big mono">'+overdue+'</div><div class="s">'+(overdue?'esperan una nueva fecha':'ninguna pendiente')+(moves?' · '+moves+(moves===1?' replanificación':' replanificaciones')+' en total':'')+'</div></div>'+
   '<div class="tile"><div class="k">Rutinas</div><div class="big mono">'+(recPast.length?ratio(recDone,recPast.length)+'%':'–')+'</div><div class="s">'+(recPast.length?recDone+' de '+recPast.length+' días cumplidos':'aparece cuando pasen días con rutinas')+'</div></div></div>';
  if(main)h+='<div class="banner" style="margin-top:14px"><span><b>Objetivo principal:</b> '+esc(main.title)+'. '+(mainToday?'Hoy ya avanzaste hacia él.':'Hoy todavía no hiciste nada que te acerque a él.')+'</span></div>';
  // últimos 14 días
  const days=[];for(let i=13;i>=0;i--)days.push(addDays(t,-i));
  const mx=Math.max(1,...days.map(d=>m[iso(d)]||0));
  h+='<div class="block"><h3>Tu quincena en el charco</h3><p class="psub" style="margin-top:0">Cada barra es un día. El punto naranja marca los días en que te tragaste el sapo.</p><div class="card chart" role="img" aria-label="Tareas completadas por día">'+days.map(d=>{const k=iso(d),c=m[k]||0,sp=S.tasks.some(x=>x.done&&x.pri==='A'&&x.doneAt===k);
    return '<div class="col'+(k===ti?' now':'')+'"><span class="n mono">'+(c||'')+'</span>'+(sp?'<span class="sdot"></span>':'')+'<i style="height:'+(c?Math.max(8,Math.round(c/mx*84)):4)+'px"></i><span class="d mono">'+d.getDate()+'</span></div>'}).join('')+'</div></div>';
  h+=paretoHtml();
  // avance por período
  h+='<div class="block"><h3>Avance de las listas</h3><div class="card">';
  ['day','week','month','year'].forEach(sc=>{
    const k=keyFor(sc,t),l=S.tasks.filter(x=>keyFor(sc,parse(x.key))===k),d=l.filter(x=>x.done).length,p=l.length?Math.round(d/l.length*100):0;
    h+='<div class="prow"><span class="pl">'+({day:'Hoy',week:'Esta semana',month:'Este mes',year:'Este año'})[sc]+'</span><div class="prog"><i style="width:'+p+'%"></i></div><span class="mono pv">'+(l.length?d+'/'+l.length:'–')+'</span></div>';
  });
  h+='</div></div>';
  // objetivos
  h+='<div class="block"><h3>Objetivos</h3>';
  if(!S.goals.length)h+='<div class="card empty">Cuando crees objetivos, acá ves si vas al ritmo de la fecha que te pusiste.</div>';
  else{h+='<div class="card pondcard">';
    S.goals.forEach(g=>{
      const s=goalState(g);
      const dn=g.steps.filter(x=>x.done&&x.doneAt),ont=dn.filter(x=>!x.due||x.doneAt<=x.due).length;
      h+='<div class="grow2"><div class="gt"><b>'+(g.main?'★ ':'')+esc(g.title)+'</b><span class="pill '+s.cls+'">'+s.txt+'</span></div>'+(g.obst?'<p class="gs" style="margin:0 0 8px">Obstáculo'+(g.obstKind==='int'?' (interno)':g.obstKind==='ext'?' (externo)':'')+': '+esc(g.obst)+'</p>':'')+
      '<div class="prog"><i style="width:'+s.p+'%"></i></div>'+
      (g.steps.length?'<div class="path">'+(()=>{let cur=false;return g.steps.map(x=>{const dn=stepFrac(g,x)>=1;let c='',f='';if(dn)c='d';else if(!cur){cur=true;c='c';f=frog('#B7E04A','pf')}return '<div class="stp '+c+'">'+f+'<i>'+(dn?'✓':'')+'</i><span>'+esc(x.text)+'</span></div>'}).join('')})()+'</div>':'')+
      '<div class="gs mono">'+s.p+'% · '+g.steps.filter(x=>stepFrac(g,x)>=1).length+' de '+g.steps.length+' pasos'+(s.left!=null?' · faltan '+s.left+' días':'')+(dn.length?' · '+ont+' de '+dn.length+' pasos en fecha':'')+'</div></div>';
    });
    h+='</div>';
  }
  h+='</div>';
  return h;
}

const TABS=[['plan','Plan'],['late','Postergadas'],['goals','Objetivos'],['gantt','Cronograma'],['dash','Panel'],['areas','Enfoque'],['letgo','Dejar ir'],['master','Lista maestra'],['arch','Archivo']];
let dismissed=false;
function autosize(el){el.style.height='auto';el.style.height=el.scrollHeight+'px'}
function sizeAll(){if(document.querySelectorAll)document.querySelectorAll('textarea.auto').forEach(autosize)}
function render(){
  const c1=syncSteps(),c2=ensureRec(today(),today());if(c1||c2)save();

  const navTab=tab==='close'?'plan':tab;

/* Sonido y temporizador */
const MODES={work:{min:90,label:'Bloque de trabajo'},start:{min:5,label:'5 minutos para arrancar'},rest:{min:15,label:'Descanso'}};
let actx=null,wake=null;
function beep(kind){
  if(S.ui.mute)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    const seq=kind==='ok'?[[660,0,.12],[880,.12,.2]]:kind==='end'?[[660,0,.2],[660,.3,.2],[880,.6,.4],[660,1.3,.2],[660,1.6,.2],[880,1.9,.5]]:[[523,0,.15],[659,.15,.15],[784,.3,.35]];
    seq.forEach(x=>{
      const o=actx.createOscillator(),g=actx.createGain(),t0=actx.currentTime+x[1];
      o.type='sine';o.frequency.value=x[0];o.connect(g);g.connect(actx.destination);
      g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.25,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+x[2]);
      o.start(t0);o.stop(t0+x[2]+.05);
    });
  }catch(e){}
}
async function keepAwake(on){
  try{
    if(on){if(navigator.wakeLock&&!wake){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>{wake=null})}}
    else if(wake){await wake.release();wake=null}
  }catch(e){}
}

}
function fireTimer(){

  t.fired=true;save();

  try{

const T=id=>S.tasks.find(t=>t.id===id);
function swap(arr,pred,id,dir){
  const idx=arr.map((x,i)=>pred(x)?i:-1).filter(i=>i>=0);
  const p=idx.findIndex(i=>arr[i].id===id),q=p+dir;
  if(p<0||q<0||q>=idx.length)return;
  const a=idx[p],b=idx[q];[arr[a],arr[b]]=[arr[b],arr[a]];
}

}
const A={
  tab(v){S.ui.tab=v;S.ui.more=false;window.scrollTo(0,0)},
  sound(){S.ui.mute=!S.ui.mute;S.ui.more=false;if(!S.ui.mute)beep('ok')},
  focus(id){if(S.ui.focus!==id)S.ui.timer=null;S.ui.focus=id;S.ui.more=false},
  fstart(v){startTimer(v)},
  fstop(){S.ui.timer=null;keepAwake(false)},
  fexit(){S.ui.focus=null;S.ui.timer=null;keepAwake(false)},
  fdone(){const t=T(S.ui.focus);if(t&&!t.done)A.tog(t.id);A.fexit()},
  bittog(id,s){const t=T(id);const b=t.bits.find(x=>x.id===s);b.done=!b.done;if(b.done)beep('ok')},
  bitdel(id,s){const t=T(id);t.bits=t.bits.filter(x=>x.id!==s)},
  goclose(){S.ui.tab='close';window.scrollTo(0,0)},
  carry(id){reschedule(T(id),tmKey())},
  carryall(){const ti=iso(today());S.tasks.filter(t=>t.scope==='day'&&t.key===ti&&!t.done&&!t.rec).forEach(t=>reschedule(t,tmKey()))},
  closeday(){const ti=iso(today());S.journal[ti]=S.journal[ti]||{};S.journal[ti].closed=true;S.ui.tab='plan';beep('close');say('Día cerrado. Buen descanso.');window.scrollTo(0,0)},
  ascore(id,s,v){const a=S.areas.find(x=>x.id===id);a.score=a.score===+v?0:+v},
  adel(id){S.areas=S.areas.filter(a=>a.id!==id)},
  asave(){const ti=iso(today()),snap={d:ti,s:{}};S.areas.forEach(a=>{snap.s[a.id]=a.score});S.areaHist=S.areaHist.filter(x=>x.d!==ti);S.areaHist.push(snap);say('Evaluación guardada.')},
  vscore(id,s,v){const x=S.vida.find(q=>q.k===id);x.score=x.score===+v?0:+v},
  habgoal(){if(S.habil&&S.habil.trim()){addGoal(S.habil.trim());S.ui.tab='goals'}else say('Escribí primero la habilidad.')},
  gokind(id,s,v){const g=goalOf(id);g.obstKind=g.obstKind===v?undefined:v},
  lgkind(id,s,v){const x=S.letgo.find(q=>q.id===id);x.kind=v},
  lgdone(id){const x=S.letgo.find(q=>q.id===id);x.done=!x.done;if(x.done)beep('ok')},
  lgdel(id){S.letgo=S.letgo.filter(q=>q.id!==id)},
  more(){S.ui.more=!S.ui.more},
  zoom(v){S.ui.zoom=v},
  tog(id){const t=T(id);if(!t)return;t.done=!t.done;stamp(t);
    if(t.stepId){const g=goalOf(t.goalId);const s=g&&g.steps.find(x=>x.id===t.stepId);if(s&&!s.rep){s.done=t.done;stamp(s)}}
    if(t.done){cheer();if(!t.impact)S.ui.open=id}},
  rep(id,s){const st=goalOf(id).steps.find(x=>x.id===s),ti=iso(today());
    if(st.rep){
      delete st.rep;
      S.tasks=S.tasks.filter(t=>{const kill=t.stepId===s&&t.rec&&!t.done&&t.key>=ti;if(kill&&st.gen)delete st.gen[t.key];return !kill});
    }else{
      st.rep=[today().getDay()];st.done=false;delete st.doneAt;
      S.tasks=S.tasks.filter(t=>!(t.stepId===s&&!t.rec&&!t.done));
      ensureRec(today(),today());
    }},
  repday(id,s,v){const st=goalOf(id).steps.find(x=>x.id===s);const n=+v;
    st.rep=st.rep.includes(n)?st.rep.filter(x=>x!==n):st.rep.concat(n);ensureRec(today(),today())},
  resched(id,s,v){const t=T(id);reschedule(t,iso(v==='today'?today():addDays(today(),1)))},
  gmn(v){const k=S.ui.gm||keyFor('month',today());S.ui.gm=keyFor('month',shiftDate('month',keyStart('month',k),+v))},
  gnow(){S.ui.gm=keyFor('month',today())},
  dismiss(){dismissed=true},
  gmain(id){const g=goalOf(id);const on=!g.main;S.goals.forEach(x=>{x.main=false});g.main=on},
  up(id){const t=T(id);swap(S.tasks,x=>x.scope===t.scope&&x.key===t.key&&x.pri===t.pri,id,-1)},
  dn(id){const t=T(id);swap(S.tasks,x=>x.scope===t.scope&&x.key===t.key&&x.pri===t.pri,id,1)},
  pri(id){const t=T(id);const i=t.pri?PRI.indexOf(t.pri)+1:0;if(i>=PRI.length)delete t.pri;else t.pri=PRI[i]},
  detail(id){S.ui.open=S.ui.open===id?null:id},
  imp(id,s,v){const t=T(id);const n=+v;t.impact=t.impact===n?undefined:n},
  mtog(id){const m=S.master.find(x=>x.id===id);m.done=!m.done},
  mup(id){swap(S.master,()=>true,id,-1)},
  mdn(id){swap(S.master,()=>true,id,1)},
  mdel(id){S.master=S.master.filter(m=>m.id!==id)},
  mopt(id){S.ui.mopen=S.ui.mopen===id?null:id},
  archmore(){S.ui.arch=(S.ui.arch||14)+14},
  gcol(id){const g=goalOf(id);g.collapsed=!g.collapsed},
  gcolall(v){S.goals.forEach(g=>{g.collapsed=v==='1'})},
  mgoal(id){const m=S.master.find(x=>x.id===id);addGoal(m.text);S.master=S.master.filter(x=>x.id!==id);S.ui.tab='goals'},
  stog(id,s){const g=goalOf(id);const st=g.steps.find(x=>x.id===s);st.done=!st.done;stamp(st);S.tasks.forEach(t=>{if(t.stepId===s){t.done=st.done;stamp(t)}});if(st.done)cheer()},
  sdel(id,s){const g=goalOf(id);g.steps=g.steps.filter(x=>x.id!==s);S.tasks=S.tasks.filter(t=>t.stepId!==s||t.done)},
  gdel(id){if(armed!==id){armed=id;setTimeout(()=>{if(armed===id){armed=null;render()}},3500);return}
    armed=null;S.goals=S.goals.filter(g=>g.id!==id);S.tasks.forEach(t=>{if(t.goalId===id){delete t.goalId;delete t.stepId}})},
  clearex(){S.master=S.master.filter(x=>!x.ex);{const ex=S.goals.filter(x=>x.ex).map(x=>x.id);S.goals=S.goals.filter(x=>!x.ex);S.tasks=S.tasks.filter(x=>!x.ex&&!ex.includes(x.goalId))}},
  backup(){panel=1;S.ui.more=false},
  closepanel(){panel=null}
};

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act;
  if(act==='closepanel'&&e.target!==el&&!e.target.closest('button[data-act="closepanel"]'))return;
  if(act==='copy'){const ta=$('#bk');ta.select();let ok=false;
    try{navigator.clipboard.writeText(ta.value).then(()=>{$('#bkmsg').textContent='Copiado.'},()=>{$('#bkmsg').textContent='No se pudo copiar. Seleccioná el texto y copialo a mano.'});ok=true}catch(x){}
    if(!ok)$('#bkmsg').textContent='Seleccioná el texto y copialo a mano.';return}
  if(act==='restore'){try{const d=JSON.parse($('#bk').value);if(!d||d.v!==1||!Array.isArray(d.tasks))throw 0;S=prep(d);panel=null;save();render()}catch(x){$('#bkmsg').textContent='El texto no es un respaldo válido.'}return}
  const f=A[act];if(!f)return;
  f(el.dataset.id||el.dataset.v,el.dataset.s,el.dataset.v);
  save();render();
});

document.addEventListener('change',e=>{
  const el=e.target,f=el.dataset.f;if(!f)return;
  const id=el.dataset.id,v=el.value;
  let re=false; /* solo se redibuja si desaparece una fila, para no perder el toque siguiente */
  if(f==='task'){const t=T(id);if(t){if(v.trim())t.text=v.trim();else re=true}}
  else if(f==='resched'){const t=T(id);if(t&&v){reschedule(t,v);re=true}}
  else if(f==='redate'){const t=T(id);if(t&&v){t.key=v;re=true}}
  else if(f==='why'){const t=T(id);if(t)t.why=v.trim()||undefined}
  else if(f==='master'){const m=S.master.find(x=>x.id===id);if(m){if(v.trim())m.text=v.trim();else re=true}}
  else if(f==='gtitle'){const g=goalOf(id);if(v.trim())g.title=v.trim()}
  else if(f==='gstart')goalOf(id).start=v;
  else if(f==='tres')S.tres[+id]=v.trim();
  else if(f==='aname'){const a=S.areas.find(x=>x.id===id);if(a&&v.trim())a.name=v.trim()}
  else if(f==='habil')S.habil=v.trim();
  else if(f==='vmetas'){const x=S.vida.find(q=>q.k===id);if(x)x.metas=v}
  else if(f==='lg'){const x=S.letgo.find(q=>q.id===id);if(x&&v.trim())x.text=v.trim()}
  else if(f==='jgood'||f==='jlesson'){const ti=iso(today());S.journal[ti]=S.journal[ti]||{};S.journal[ti][f==='jgood'?'good':'lesson']=v.trim()||undefined}
  else if(f==='gobst')goalOf(id).obst=v.trim()||undefined;
  else if(f==='gdue')goalOf(id).due=v;
  else if(f==='stext'){const st=goalOf(id).steps.find(x=>x.id===el.dataset.s);if(v.trim()){st.text=v.trim();S.tasks.forEach(t=>{if(t.stepId===st.id)t.text=st.text})}}
  else if(f==='sdue'){const st=goalOf(id).steps.find(x=>x.id===el.dataset.s);st.due=v||undefined;
    const lt=S.tasks.find(t=>t.stepId===st.id&&!t.rec&&!t.done);if(lt&&v){lt.scope='day';lt.key=v}
    syncSteps();re=true}
  save();if(re)render();
});

document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches&&e.target.matches('textarea.auto')){e.preventDefault();e.target.blur()}});
document.addEventListener('input',e=>{if(e.target.matches&&e.target.matches('textarea.auto'))autosize(e.target)});
document.addEventListener('submit',e=>{
  e.preventDefault();
  const form=e.target,kind=form.dataset.add;
  const input=form.querySelector('input[type=text]');const text=input.value.trim();
  if(!text)return;
  if(kind==='plan'){
    const gid=$('#addGoal').value;
    S.tasks.push({id:uid(),text:text,scope:'day',key:($('#addDate').value||iso(today())),goalId:gid||undefined});
  }else if(kind==='master')S.master.push({id:uid(),text:text});
  else if(kind==='goal')addGoal(text);
  else if(kind==='bit'){const t=T(form.dataset.id);if(t)(t.bits=t.bits||[]).push({id:uid(),text:text})}
  else if(kind==='tomorrow')S.tasks.push({id:uid(),text:text,scope:'day',key:tmKey()});
  else if(kind==='area')S.areas.push({id:uid(),name:text,score:0});
  else if(kind==='letgo'){const sel=form.querySelector('select');S.letgo.unshift({id:uid(),text:text,kind:sel?sel.value:'postergar'})}
  else if(kind==='step'){const g=goalOf(form.dataset.id);g.steps.push({id:uid(),text:text})}
  save();
  if(kind==='step'||kind==='bit'){const gid=form.dataset.id;render();const f=document.querySelector('form[data-add="'+kind+'"][data-id="'+gid+'"] input');if(f)f.focus()}
  else if(kind==='area'){render()}
  else{focusId='addInput';render()}
});

/* al abrir: genera las repeticiones de los días desde la última vez que se usó la app (hasta 31 días) */
function startup(){
  const t=today(),ti=iso(t),last=S.ui.lastRun;
  let from=last&&last<ti?addDays(parse(last),1):t;
  if(t-from>31*864e5)from=addDays(t,-31);
  const ch=ensureRec(from,t);
  if(ch||last!==ti){S.ui.lastRun=ti;save()}
  const tm=S.ui.timer;
  if(tm&&!tm.fired&&Date.now()-tm.endAt>120000){tm.fired=true;save()}
  if(S.ui.focus&&tm&&!tm.fired)keepAwake(true);
}
startup();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(sizeAll);
/* si la app quedó abierta de un día para otro, al volver se actualiza sola */
document.addEventListener('visibilitychange',()=>{if(!document.hidden){cleanup(S);startup();render()}});
render();
})();
</script>
